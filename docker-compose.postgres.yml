services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: "uft_superset"
      POSTGRES_USER: "superset"
      POSTGRES_PASSWORD: "superset"

    ports:
      - "5432:5432"

    volumes:
      - uft_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U superset -d uft_superset"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uft_postgres_data:
